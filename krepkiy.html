<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Крепкий +30%</title>
<style>
body{font-family:Arial;background:#111;color:#fff;padding:15px;margin:0}
h1{color:#ffcc00;text-align:center}
.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px}
.nav a{background:#222;padding:10px 16px;border-radius:8px;color:#fff;text-decoration:none;border:1px solid #444}
.nav a.active{background:#ffcc00;color:#000;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:14px}
.card h3{color:#ffcc00;font-size:15px;margin:0 0 6px}
.sales{color:#888;font-size:12px}
.row{display:flex;justify-content:space-between;margin-top:8px;align-items:center}
input{width:100px;padding:6px;border-radius:6px;background:#000;color:#fff;border:1px solid #555}
.price{color:#00ff88;font-weight:bold;font-size:17px}
</style>
</head>
<body>
<h1>КРЕПКИЙ +30%</h1>
<div class="nav"><a href="index.html">Главная</a><a href="pivo.html">Пиво</a><a href="#" class="active">Крепкое</a><a href="snacks.html">Снэки</a><a href="ryba.html">Рыба</a></div>
<div class="grid" id="grid"></div>
<script>
const products=[["Родная Степь 0,2 - 619 прод.",619],["Хаома Зеренда 0.2 - 182",182],["Коньяк 0.2 5 звезд - 172",172],["Коньяк 0.2 3-зв - 165",165],["TauSamali 0,5 - 158",158],["Синяя гора мягкая - 155",155],["Кызыл Жар черная 0,5 - 116",116],["Хаома 0.5 - 105",105],["Кызыл Жар черная 0,2 - 95",95],["Казахстан 0.375л - 89",89],["Казахстан 0.5л - 84",84],["Казахстан 0.2л - 70",70],["Казахстан 0,350 - 67",67],["Кызыл Жар 0,7 - 66",66],["Коньяк 0.5 каз 5зв - 61",61],["Зеленая Марка 0.25 - 50",50],["Синяя Гора 0,65 - 46",46],["Хаома 0.7л - 46",46],["Полюс 0.5 - 38",38],["Немиров 0.7 - 34",34],["Асти - 27",27],["Хаома 0,375 - 25",25],["Stolichnaya 0.5 - 24",24],["Казахстан 0.75 - 23",23],["Полюс Платинум 0,7 - 21",21],["Clan MacGregor 0.35 - 18",18],["Вино Алазанская 15",15],["Highland 5 лет 0.35 - 12",12],["Ballantines 0,5 - 8",8],["Абсолют 0,5 - 6",6],["Jameson 0.5 - 5",5],["Santo Stefano 5",5],["Oakheart 0,7 - 2",2]];
const grid=document.getElementById('grid');
products.forEach((p,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<h3>${p[0]}</h3><div class="sales">Продаж: ${p[1]}</div><div class="row"><span>Закупка:</span><input type="number" id="b${i}" placeholder="1850" oninput="c(${i})"></div><div class="row"><span>Продажа +30%:</span><span class="price" id="p${i}">—</span></div>`;grid.appendChild(d);});
function c(i){let b=parseFloat(document.getElementById('b'+i).value);document.getElementById('p'+i).innerText=b?Math.round(b*1.3)+' ₸':'—';}
</script>
</body>
</html>
