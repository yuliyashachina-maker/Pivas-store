let active='Все';
const cats=['Все','Семечки','Чипсы','Сухарики','Курт','Сладкое'];
function renderFilters(){
  document.getElementById('filters').innerHTML=cats.map(c=>`<button class="${c===active?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');
}
function setCat(c){active=c;renderFilters();render();}
function render(){
  const list=products.filter(p=>active==='Все'||p.cat===active);
  document.getElementById('grid').innerHTML=list.map((p,i)=>{
    const idx=products.indexOf(p);
    return `<div class="card"><h3>${p.name}</h3><div class="price">${p.price} тг</div><div style="font-size:12px;color:#aaa">1 шт</div><button onclick="addToCart(${idx})">В корзину</button></div>`;
  }).join('');
}
function addToCart(idx){
  const p=products[idx];
  let cart=JSON.parse(localStorage.getItem('cart')||'[]');
  let found=cart.find(x=>x.name===p.name);
  if(found){found.qty+=1;} else {cart.push({name:p.name,price:p.price,qty:1,unit:'шт'});}
  localStorage.setItem('cart',JSON.stringify(cart));
  updateCount();

}
function updateCount(){
  let cart=JSON.parse(localStorage.getItem('cart')||'[]');
  document.getElementById('cartCount').textContent=cart.reduce((s,x)=>s+x.qty,0);
}
renderFilters();render();updateCount();
