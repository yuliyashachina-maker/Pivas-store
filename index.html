<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Корзина</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:Arial;padding:20px}
a{color:#e63946;text-decoration:none}
.item{display:flex;justify-content:space-between;padding:12px;background:#1a1a1a;margin:8px 0;border-radius:8px}
button{background:#e63946;color:#fff;border:none;padding:10px 15px;border-radius:6px;cursor:pointer}
#total{font-size:20px;font-weight:bold;margin-top:15px}
</style>
</head>
<body>
<a href="index.html">← Назад в магазин</a>
<h1>🛒 Корзина</h1>
<div id="cart-items"></div>
<div id="total"></div>
<br>
<button onclick="clearCart()">Очистить корзину</button>
<button onclick="orderWhatsApp()" style="background:#25D366;margin-left:10px">Заказать в WhatsApp</button>

<script>
function loadCart(){
 var c=JSON.parse(localStorage.getItem('cart')||'[]');
 var div=document.getElementById('cart-items');
 var total=0;
 if(c.length==0){div.innerHTML='<p>Корзина пуста</p>';return}
 div.innerHTML='';
 c.forEach((it,i)=>{
  total+=it.price;
  div.innerHTML+=`<div class="item"><span>${it.name} - ${it.price} тг</span><span onclick="removeItem(${i})" style="color:red;cursor:pointer">✕</span></div>`;
 });
 document.getElementById('total').textContent='Итого: '+total+' тг ('+c.length+' шт)';
}
function removeItem(i){
 var c=JSON.parse(localStorage.getItem('cart')||'[]');
 c.splice(i,1);
 localStorage.setItem('cart',JSON.stringify(c));
 loadCart();
}
function clearCart(){
 localStorage.removeItem('cart');
 loadCart();
}
function orderWhatsApp(){
 var c=JSON.parse(localStorage.getItem('cart')||'[]');
 if(c.length==0){alert('Корзина пуста');return}
 var text='Здравствуйте! Хочу заказать:%0A';
 var total=0;
 c.forEach(it=>{text+=`- ${it.name} ${it.price}тг%0A`;total+=it.price});
 text+=`%0AИтого: ${total} тг`;
 window.open('https://wa.me/77000000000?text='+text,'_blank');
}
loadCart();
</script>
</body>
</html>
