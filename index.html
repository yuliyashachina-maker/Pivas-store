<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pivas Store</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background:#000;color:#fff;padding-bottom:90px">
<script>const WA="77017531337";</script>
<header class="sticky top-0 z-20 p-4 flex justify-between items-center bg-black border-b border-yellow-500">
<b style="color:#fbbf24">ПИВАС STORE</b>
<button onclick="openCart()" class="bg-yellow-400 text-black px-4 py-2 rounded-full font-black">🛒 <span id="cnt">0</span></button>
</header>
<img src="IMG-20261118-WA8679.jpg" style="width:100%" onerror="this.src='banner.jpg'">
<div class="p-3 flex gap-2 overflow-auto bg-black">
<button onclick="show('all')" class="bg-yellow-400 text-black px-4 py-2 rounded-full font-bold">Все</button>
<button onclick="show('Пиво')" class="bg-zinc-800 px-4 py-2 rounded-full">🍺 Пиво</button>
<button onclick="show('Снеки')" class="bg-zinc-800 px-4 py-2 rounded-full">🥨 Снеки</button>
<button onclick="show('Орехи')" class="bg-zinc-800 px-4 py-2 rounded-full">🥜 Орехи</button>
</div>
<div id="list" class="p-4 grid grid-cols-2 gap-3 bg-zinc-900"></div>
<div id="cart" class="fixed inset-0 bg-black/80 z-50 hidden">
<div class="bg-white text-black h-full max-w-md ml-auto p-5 flex flex-col">
<div class="flex justify-between mb-4"><h2 class="font-black text-xl">Корзина</h2><button onclick="closeCart()" class="text-2xl">✕</button></div>
<div id="cartItems" class="flex-1 overflow-auto space-y-2"></div>
<div class="border-t pt-3">
<div class="flex justify-between font-black text-lg mb-3">Итого: <span id="total">0 ₸</span></div>
<button onclick="order()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black">💬 Заказать в WhatsApp</button>
<p class="text-xs text-center text-gray-500 mt-2">Можно 1, 5, 50, 100 шт — без лимита!</p>
</div>
</div>
</div>
<script>
let DATA=[
{id:1,n:"Лагер 0.5л",p:990,c:"Пиво",img:"https://images.unsplash.com/photo-1608270586620-248524c67de9?w=300"},
{id:2,n:"Темный Эль 0.5л",p:1190,c:"Пиво",img:"https://images.unsplash.com/photo-1558346489-19413928158b?w=300"},
{id:3,n:"Чипсы Паприка",p:690,c:"Снеки",img:"https://images.unsplash.com/photo-1566478989037-eec170784d0b?w=300"},
{id:4,n:"Арахис 100г",p:590,c:"Орехи",img:"https://images.unsplash.com/photo-1508061253366-f7da158b6d46?w=300"},
{id:5,n:"Фисташки 80г",p:1290,c:"Орехи",img:"https://images.unsplash.com/photo-1573551089778-46a7abc39d9f?w=300"},
{id:6,n:"Сухарики",p:490,c:"Снеки",img:"https://images.unsplash.com/photo-1599490659213-cebb6435d4d1?w=300"}
];
let CART=[];let cur="all";
function show(c){if(c)cur=c;let f=cur=="all"?DATA:DATA.filter(x=>x.c==cur);document.getElementById("list").innerHTML=f.map(x=>`<div class="bg-zinc-800 rounded-2xl p-3"><img src="${x.img}" style="width:100%;height:100px;object-fit:cover;border-radius:10px"><div class="font-bold text-sm mt-2 h-8">${x.n}</div><div class="flex justify-between items-center mt-2"><b class="text-yellow-400">${x.p} ₸</b><button onclick="add(${x.id})" class="bg-yellow-400 text-black w-8 h-8 rounded-full font-black">+</button></div></div>`).join("")}
function add(id){let pr=DATA.find(x=>x.id==id);let f=CART.find(x=>x.id==id);if(f)f.q++;else CART.push({...pr,q:1});upd()}
function upd(){document.getElementById("cnt").innerText=CART.reduce((s,x)=>s+x.q,0);document.getElementById("total").innerText=CART.reduce((s,x)=>s+x.p*x.q,0)+" ₸";let box=document.getElementById("cartItems");if(CART.length==0)box.innerHTML="<p class='text-center text-gray-400 mt-10'>Корзина пуста<br>Добавь пиво! 🍺</p>";else box.innerHTML=CART.map(x=>`<div class="flex justify-between items-center bg-gray-100 p-3 rounded-xl"><div><b class="text-sm">${x.n}</b><div class="text-xs">${x.p} x ${x.q} = ${x.p*x.q} ₸</div></div><div class="flex gap-1 items-center"><button onclick="chg(${x.id},-1)" class="border w-8 h-8 rounded-full">-</button><b>${x.q}</b><button onclick="chg(${x.id},1)" class="border w-8 h-8 rounded-full">+</button></div></div>`).join("")}
function chg(id,d){let f=CART.find(x=>x.id==id);f.q+=d;if(f.q<=0)CART=CART.filter(x=>x.id!=id);upd()}
function openCart(){document.getElementById("cart").classList.remove("hidden")}
function closeCart(){document.getElementById("cart").classList.add("hidden")}
function order(){if(CART.length==0){alert("Пусто!");return}let t="🍺 Заказ PIVAS%0A";CART.forEach(x=>t+=`• ${x.n} - ${x.q}шт = ${x.q*x.p}₸%0A`);t+=`%0AИтого: ${CART.reduce((s,x)=>s+x.p*x.q,0)}₸`;window.open("https://wa.me/"+WA+"?text="+t,"_blank")}
show("all");upd();
</script>
</body>
</html>
