
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pivas Store - Пиво и Снеки</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background:#f7f7f7;padding-bottom:100px">
<script>
const WHATSAPP_NUMBER = "77017531337";
</script>

<header class="bg-white sticky top-0 z-30 shadow-sm p-4 flex justify-between items-center">
<div class="font-black text-xl">Pivas <span style="color:#f97316">Store 🍺</span></div>
<button onclick="openCart()" style="background:#f97316" class="text-white px-4 py-2 rounded-full font-bold">🛒 Корзина <span id="cart-count" class="bg-white text-orange-500 rounded-full px-2 ml-1">0</span></button>
</header>

<div class="m-4 bg-gradient-to-r from-orange-400 to-orange-200 rounded-2xl p-5 text-white">
<h2 class="font-bold text-lg">Скидка 15% на набор к пятнице!</h2>
<p class="text-sm opacity-90">Пиво и снеки с доставкой за 30 мин</p>
</div>

<div class="px-4 flex gap-2 overflow-x-auto pb-2">
<button onclick="filterCat('all')" class="cat-btn bg-orange-500 text-white px-4 py-2 rounded-full font-bold">Все</button>
<button onclick="filterCat('Пиво')" class="cat-btn bg-white px-4 py-2 rounded-full font-bold">🍺 Пиво</button>
<button onclick="filterCat('Снеки')" class="cat-btn bg-white px-4 py-2 rounded-full font-bold">🥨 Снэки</button>
<button onclick="filterCat('Орехи')" class="cat-btn bg-white px-4 py-2 rounded-full font-bold">🥜 Орехи</button>
</div>

<div id="products" class="p-4 grid grid-cols-2 gap-4"></div>

<div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden">
<div class="bg-white h-full w-full max-w-md ml-auto p-5 flex flex-col">
<div class="flex justify-between items-center mb-4">
<h2 class="font-black text-2xl">Корзина</h2>
<button onclick="closeCart()" class="text-2xl">✕</button>
</div>
<div id="cart-items" class="flex-1 overflow-auto space-y-3"></div>
<div class="border-t pt-4">
<div class="flex justify-between font-bold text-lg mb-4"><span>Итого:</span><span id="cart-total">0 ₸</span></div>
<button onclick="orderWhatsApp()" class="w-full bg-green-500 text-white py-4 rounded-2xl font-black text-lg">💬 Заказать в WhatsApp</button>
<p class="text-xs text-gray-500 text-center mt-2">Заказ придет на 701-753-13-37</p>
</div>
</div>
</div>

<script>
const productsData = [
{id:1,name:"Лагер Светлое 0.5л",price:990,cat:"Пиво",img:"🍺"},
{id:2,name:"Эль Темный 0.5л",price:1190,cat:"Пиво",img:"🍺"},
{id:3,name:"Pilsner 0.5л",price:1090,cat:"Пиво",img:"🍺"},
{id:4,name:"Чипсы паприка 80г",price:690,cat:"Снеки",img:"🥔"},
{id:5,name:"Сухарики чесночные",price:490,cat:"Снеки",img:"🥖"},
{id:6,name:"Арахис соленый 100г",price:590,cat:"Орехи",img:"🥜"},
{id:7,name:"Фисташки 80г",price:1290,cat:"Орехи",img:"🥜"},
{id:8,name:"Сыр косичка",price:790,cat:"Снеки",img:"🧀"},
];
let cart=[];let curCat='all';
function render(){
  const cont=document.getElementById('products');
  const filtered=curCat==='all'?productsData:productsData.filter(p=>p.cat===curCat);
  cont.innerHTML=filtered.map(p=>`<div class="bg-white rounded-2xl p-4 shadow-sm"><div class="text-5xl text-center mb-3">${p.img}</div><div class="font-bold text-sm h-10">${p.name}</div><div class="flex justify-between items-center mt-3"><span class="font-black">${p.price} ₸</span><button onclick="addToCart(${p.id})" class="bg-orange-500 text-white w-9 h-9 rounded-full font-black text-xl">+</button></div></div>`).join('');
}
function filterCat(c){curCat=c;render();}
function addToCart(id){
  const prod=productsData.find(p=>p.id===id);
  const found=cart.find(c=>c.id===id);
  if(found) found.qty++; else cart.push({...prod,qty:1});
  updateCart();
}
function updateCart(){
  document.getElementById('cart-count').textContent=cart.reduce((s,c)=>s+c.qty,0);
  const total=cart.reduce((s,c)=>s+c.price*c.qty,0);
  document.getElementById('cart-total').textContent=total+' ₸';
  const cont=document.getElementById('cart-items');
  if(cart.length===0) cont.innerHTML='<p class="text-center text-gray-400 mt-10">Корзина пуста<br>Добавь пиво и снеки!</p>';
  else cont.innerHTML=cart.map(i=>`<div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl"><div><div class="font-bold">${i.name}</div><div class="text-sm text-gray-500">${i.price} ₸ x ${i.qty}</div></div><div class="flex gap-2 items-center"><button onclick="changeQty(${i.id},-1)" class="bg-white border w-8 h-8 rounded-full">-</button><span class="font-bold">${i.qty}</span><button onclick="changeQty(${i.id},1)" class="bg-white border w-8 h-8 rounded-full">+</button></div></div>`).join('');
}
function changeQty(id,d){
  const f=cart.find(c=>c.id===id);
  if(!f) return;
  f.qty+=d;
  if(f.qty<=0) cart=cart.filter(c=>c.id!==id);
  updateCart();
}
function openCart(){document.getElementById('cart-modal').classList.remove('hidden');}
function closeCart(){document.getElementById('cart-modal').classList.add('hidden');}
function orderWhatsApp(){
  if(cart.length===0){alert('Корзина пуста!');return;}
  let msg=`🍺 *Заказ Pivas Store*%0A%0A`;
  cart.forEach(i=>{msg+=`• ${i.name} - ${i.qty} шт x ${i.price} ₸ = ${i.qty*i.price} ₸%0A`;});
  const total=cart.reduce((s,c)=>s+c.price*c.qty,0);
  msg+=`%0A*Итого: ${total} ₸*%0A%0AДоставка за 30 мин?`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`,'_blank');
}
render();updateCart();
</script>
</body>
</html>
