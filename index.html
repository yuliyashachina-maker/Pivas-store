<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ПИВАС Целиноград</title>
<style>
body{margin:0;font-family:system-ui;background:#FFF8E0}
header{background:#111;color:#FFD700;padding:12px;text-align:center;font-weight:800}
.banner-img{width:100%;max-height:300px;object-fit:cover;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;max-width:900px;margin:auto}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;flex-direction:column}
.card img.prod{width:100%;height:130px;object-fit:cover}
.price{color:#E65100;font-weight:800;margin:6px 0;font-size:17px}
.btn{background:#111;color:#FFD700;border:none;border-radius:20px;padding:9px;width:100%;font-weight:800;cursor:pointer}
#cart{position:fixed;bottom:0;left:0;right:0;background:#111;color:#fff;border-top:3px solid #FFD700;padding:12px;display:none;z-index:10}
#cart.show{display:block}
#search{width:calc(100% - 20px);margin:10px;padding:12px;border-radius:25px;border:2px solid #FFD700;font-size:16px}
</style></head>
<body>
<header>🍺 ПИВАС • 8-701-753-13-37 • Целиноград</header>
<img src="banner.jpg" class="banner-img">
<div style="max-width:900px;margin:auto"><input id="search" placeholder="Поиск..." oninput="doFilter()"></div>
<div class="grid" id="grid"></div>
<div id="cart"><div id="items"></div><b>Итого: <span id="total">0</span> ₸</b><br><button onclick="order()" style="background:#25D366;color:#fff;border:none;padding:14px;width:100%;border-radius:25px;font-size:18px;font-weight:800;margin-top:8px">Заказать в WhatsApp</button></div>
<script>
const all=[
 {"name":"Стакан","price":13,"img":"https://images.unsplash.com/photo-1560512823-5a67de3e1a5d?w=300"},
{"name":"Пакет","price":20,"img":"https://images.unsplash.com/photo-1599490659213-cebb6435d4d1?w=300"},
{"name":"Спички","price":27,"img":"https://images.unsplash.com/photo-1599490659213-cebb6435d4d1?w=300"},
{"name":"Бутылка","price":27,"img":"https://images.unsplash.com/photo-1560512823-5a67de3e1a5d?w=300"},
{"name":"Дербес Прага 1.5","price":594,"img":"https://images.unsplash.com/photo-1608270586620-248524c67de9?w=300"},
{"name":"Чечил Кнут/Грузинский","price":432,"img":"https://images.unsplash.com/photo-1603360946369-dc9bb6258143?w=300"},
{"name":"Дербес Немецкое 1,5","price":550,"img":"https://images.unsplash.com/photo-1608270586620-248524c67de9?w=300"},
{"name":"Алма-Ата Жигулевское 1.5","price":594,"img":"https://images.unsplash.com/photo-1608270586620-248524c67de9?w=300"},
{"name":"Уральское Жигулевское 1.5","price":594,"img":"https://images.unsplash.com/photo-1608270586620-248524c67de9?w=300"},
{"name":"Дербес Немецкое 0.5","price":283,"img":"https://images.unsplash.com/photo-1608270586620-248524c67de9?w=300"},
{"name":"Тара","price":135,"img":"https://images.unsplash.com/photo-1599490659213-cebb6435d4d1?w=300"},
{"name":"Пробка пласт","price":7,"img":"https://images.unsplash.com/photo-1599490659213-cebb6435d4d1?w=300"},
{"name":"Лещ 10% Вяленый","price":2025,"img":"https://images.unsplash.com/photo-1603360946369-dc9bb6258143?w=300"},
{"name":"Miller б/а стекло 0.33","price":459,"img":"https://images.unsplash.com/photo-1560512823-5a67de3e1a5d?w=300"},
{"name":"ABSOLUT 1л","price":9991,"img":"https://images.unsplash.com/photo-1560512823-5a67de3e1a5d?w=300"},
{"name":"Вобла 20% вяленая","price":4050,"img":"https://images.unsplash.com/photo-1603360946369-dc9bb6258143?w=300"},
{"name":"Бычок Азовский","price":2025,"img":"https://images.unsplash.com/photo-1603360946369-dc9bb6258143?w=300"},
{"name":"Lays рифл 70гр","price":486,"img":"https://images.unsplash.com/photo-1599490659213-cebb6435d4d1?w=300"},
{"name":"Щука с икрой вяленая","price":6750,"img":"https://images.unsplash.com/photo-1603360946369-dc9bb6258143?w=300"},
 ];
let cart={};
function render(list){let h='';list.forEach(p=>{h+=`<div class="card"><img class="prod" src="${p.img}" loading="lazy"><div style="padding:10px"><b>${p.name}</b><div class="price">${p.price} ₸</div><button class="btn" onclick="add('${p.name.replace(/'/g,"")}')">В корзину</button></div></div>`;});document.getElementById('grid').innerHTML=h;}
function add(name){let p=all.find(x=>x.name===name);if(!cart[name])cart[name]={...p,count:0};cart[name].count++;upd();}
function upd(){let t=0,html='';for(let k in cart){t+=cart[k].count*cart[k].price;html+=`${k} x${cart[k].count}<br>`;}document.getElementById('items').innerHTML=html;document.getElementById('total').innerText=t;document.getElementById('cart').classList.toggle('show',t>0);}
function order(){let msg='Здравствуйте, ПИВАС! Заказ:%0A';for(let k in cart)msg+=`- ${k} x${cart[k].count} = ${cart[k].count*cart[k].price} ₸%0A`;msg+=`Итого ${document.getElementById('total').innerText} ₸`;window.open('https://wa.me/77017531337?text='+msg,'_blank');}
function doFilter(){let q=document.getElementById('search').value.toLowerCase();render(all.filter(p=>p.name.toLowerCase().includes(q)));}
render(all);
</script></body></html>
