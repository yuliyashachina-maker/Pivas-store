<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пиво</title><style>body{background:#111;color:#fff;font-family:sans-serif;text-align:center}.top a{color:#fff;margin:5px;text-decoration:none}.top a.active{color:#ff8c00}.container{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#222244;border-radius:10px;padding:10px}.price{font-size:18px;font-weight:bold}.btns{display:flex;gap:5px;justify-content:center}.btns button{background:#333366;color:#fff;border:none;padding:5px;border-radius:5px}.btns button.selected{background:#ff8c00}.cart-btn{background:#ff8c00;border:none;padding:8px;border-radius:5px;margin-top:5px}.cart-link{display:block;text-align:center;color:#ff8c00;margin:15px}</style></head><body>
<div class="top"><a href="index.html" class="active">🍺 Пиво</a> <a href="krepkiy.html">🥃 Крепкое</a> <a href="snacks.html">🍿 Снэки</a> <a href="ryba.html">🐟 Рыба</a></div>
<h1>🍺 РАЗЛИВНОЕ ПИВО</h1><p>Выбери объём и нажми 🛒</p><div class="container" id="products"></div><a href="cart.html" class="cart-link">🛒 Перейти в корзину</a>
<script>
const beers=[{name:"ŽATECKÝ GUS",price:750},{name:"ШЫМКЕНТ ПРАГА",price:750},{name:"СССР",price:750},{name:"АЛМА-АТА",price:750},{name:"БИРХАН",price:750},{name:"МИЛБОРГ",price:750},{name:"ШТУТГАРТ",price:750},{name:"ДЕРБЕС НЕМЕЦКОЕ",price:750},{name:"ДЕРБЕС ПРАГА",price:750},{name:"ЧЕШСКОЕ",price:750},{name:"ШЫМКЕНТ МЯГКОЕ",price:750}];
let selected={};
function render(){let h='';for(let i=0;i<beers.length;i++){let b=beers[i];h+='<div class="card"><h3>'+b.name+'</h3><div class="price">'+b.price+' ₸ / л</div><div class="btns">';for(let v of [1,1.5,2]){h+='<button class="'+((selected[i]||1)==v?'selected':'')+'" onclick="selectLiters('+i+','+v+',this)">'+v+' л</button>';}h+='</div><button class="cart-btn" onclick="addToCart('+i+')">В корзину</button></div>';}document.getElementById('products').innerHTML=h;}
function selectLiters(i,liters,btn){selected[i]=liters;let b=btn.parentElement.querySelectorAll('button');b.forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');}
function addToCart(i){let b=beers[i];let liters=selected[i]||1;let cart=JSON.parse(localStorage.getItem('cart')||'[]');cart.push({name:b.name,price:b.price,liters:liters});localStorage.setItem('cart',JSON.stringify(cart));alert('Добавлено: '+b.name+' '+liters+' л');}
render();
</script></body></html>
