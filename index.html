<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пивас Store</title>
<style>
body{background:#111;color:#fff;font-family:Arial;margin:0;padding:10px;padding-bottom:80px}
h1{text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#1a1a1a;padding:14px;border-radius:12px;text-align:center}
.card img{width:100%;height:150px;object-fit:cover;border-radius:10px}
button{background:#ffcc00;color:#000;border:0;padding:8px 10px;border-radius:8px;font-weight:bold;margin:3px}
.cart{position:fixed;bottom:0;left:0;right:0;background:#ffcc00;color:#000;padding:14px;text-align:center;font-weight:bold}
</style></head><body>
<img src="banner.jpg" style="width:100%;border-radius:12px">
<h1>Пивас Store</h1>
<div class="grid" id="list"></div>
<div class="cart" id="cart">Корзина пуста</div>
<script>
let cart=JSON.parse(localStorage.getItem('cart')||'[]');
const beers=[
 {name:'Гусь',price:750,img:'1-gus.jpg'},
{name:'Шымкент Прага',price:750,img:'2-shym-praga.jpg'},
{name:'СССР',price:750,img:'3-sssr.jpg'},
{name:'Алма-Ата Жигулёвское',price:750,img:'4-alma-ata.jpg'},
{name:'Бирхан Нефильтрованное',price:1000,img:'5-birhan.jpg'},
{name:'MILBORG',price:900,img:'6-milborg.jpg'},
{name:'STUTTGART',price:1000,img:'7-stuttgart.jpg'},
{name:'Дербес Немецкое',price:800,img:'8-derbes-nem.jpg'},
{name:'Дербес Прага',price:800,img:'9-derbes-pra.jpg'},
{name:'Чешское Элитное',price:700,img:'10-chesh.jpg'},
{name:'Шымкент Мягкое',price:750,img:'11-shym-myag.jpg'}
]; 
function show(){
document.getElementById('list').innerHTML=beers.map((b,i)=>`<div class="card"><img src="${b.img}"><h3>${b.name}</h3><p>${b.price} ₸ / 1 л</p><div><button onclick="add(${i},1)">1 л</button><button onclick="add(${i},1.5)">1.5 л</button><button onclick="add(${i},2)">2 л</button></div></div>`).join('');
let total=cart.reduce((s,x)=>s+x.price*x.vol,0);
document.getElementById('cart').innerText=cart.length?`В корзине: ${cart.length} шт - ${total} ₸`:'Корзина пуста';
}
function add(i,vol){let b=beers[i];cart.push({name:b.name,price:b.price,vol:vol});localStorage.setItem('cart',JSON.stringify(cart));show();}
show();
</script></body></html>
