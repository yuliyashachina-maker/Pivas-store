<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pivas Store</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:Arial;padding:20px}
a{color:#e63946;text-decoration:none}
.products{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.card{background:#1a1a1a;padding:10px;border-radius:10px;text-align:center}
.card img{width:100%;border-radius:8px}
button{background:#e63946;color:#fff;border:none;padding:8px 12px;border-radius:6px;margin-top:8px;cursor:pointer}
.cart-link{position:fixed;top:15px;right:15px;background:#e63946;padding:10px 15px;border-radius:20px}
</style>
</head>
<body>
<a href="cart.html" class="cart-link">🛒 Корзина</a>
<h1>Pivas Store 🍺</h1>

<div class="products">
<div class="card">
<img src="1-gus.jpg">
<p>Гусь 1</p><b>500 тг</b><br>
<button onclick="addToCart('Гусь 1',500)">В корзину</button>
</div>

<div class="card">
<img src="10-chesh.jpg">
<p>Чешское</p><b>600 тг</b><br>
<button onclick="addToCart('Чешское',600)">В корзину</button>
</div>

<div class="card">
<img src="arbuz.png">
<p>Арбуз</p><b>550 тг</b><br>
<button onclick="addToCart('Арбуз',550)">В корзину</button>
</div>

<div class="card">
<img src="mohito.png">
<p>Мохито</p><b>650 тг</b><br>
<button onclick="addToCart('Мохито',650)">В корзину</button>
</div>
</div>

<script src="cart.js"></script>
</body>
</html>
