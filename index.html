<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Снеки - Пивас Store</title>
<style>
body { margin:0; background:#000; color:#fff; font-family:sans-serif; padding-bottom:130px; }
.banner { background:linear-gradient(135deg,#7a4a00,#3a1f00); padding:20px 12px; text-align:center; }
.banner h1 { font-size:32px; margin:0; }
.banner p { font-size:16px; margin:8px 0 0; opacity:0.9; }
.lang { display:flex; justify-content:center; gap:8px; margin:14px 0; }
.lang button { background:#222; color:#fff; border:1px solid #555; padding:10px 26px; border-radius:20px; font-weight:bold; font-size:16px; }
.lang button.active { background:#7a4a00; border-color:#7a4a00; }
.back { display:block; text-align:center; margin:10px; color:#fff; font-weight:bold; text-decoration:none; background:#5a3a00; padding:12px; border-radius:12px; }
.section-title { text-align:center; font-size:22px; margin:10px 0; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px; }
.card { background:#111; border-radius:16px; padding:10px; text-align:center; }
.card img { width:100%; height:160px; object-fit:cover; border-radius:12px; }
.card h3 { margin:10px 0 5px; font-size:19px; }
.price { margin:5px 0 10px; font-size:17px; }
.vols { display:flex; justify-content:center; gap:6px; flex-wrap:wrap; }
.vols button { background:#7a4a00; color:#fff; border:none; padding:10px 14px; border-radius:10px; font-weight:bold; font-size:15px; }
.footer { text-align:center; padding:20px 12px; opacity:0.8; font-size:14px; line-height:1.6; }
.cart-bar { position:fixed; bottom:0; left:0; right:0; background:#7a3b00; color:#fff; text-align:center; padding:16px; font-size:19px; font-weight:bold; z-index:998; }
.whatsapp-btn { position:fixed; bottom:75px; right:15px; width:64px; height:64px; z-index:999; }
.whatsapp-btn img { width:64px; height:64px; border-radius:18px; box-shadow:0 6px 14px rgba(0,0,0,0.5); }
</style>
</head>
<body>
<div class="banner">
<h1 data-ru="🥨 Снеки" data-kz="🥨 Тіскебасар">🥨 Снеки</h1>
<p data-ru="К пиву — самое вкусное" data-kz="Сыраға — ең дәмдісі">К пиву — самое вкусное</p>
</div>
<div class="lang">
<button id="btn-ru" class="active" onclick="setLang('ru')">РУС</button>
<button id="btn-kz" onclick="setLang('kz')">ҚАЗ</button>
</div>
<a class="back" href="index.html" data-ru="← Назад на главную" data-kz="← Басты бетке қайту">← Назад на главную</a>

<div class="section-title" data-ru="Снеки" data-kz="Тіскебасар">Снеки</div>
<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1566478989037-eec170784d0b?w=600">
<h3 data-ru="Чипсы" data-kz="Чипсы">Чипсы</h3>
<div class="price">500 ₸</div>
<div class="vols"><button onclick="add('Чипсы',500)" data-ru="В корзину" data-kz="Себетке">В корзину</button></div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1599490659213-e2b9527bd087?w=600">
<h3 data-ru="Сухарики" data-kz="Кептірілген нан">Сухарики</h3>
<div class="price">400 ₸</div>
<div class="vols"><button onclick="add('Сухарики',400)" data-ru="В корзину" data-kz="Себетке">В корзину</button></div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1621939514649-280e2ee25f60?w=600">
<h3 data-ru="Арахис" data-kz="Жержаңғақ">Арахис</h3>
<div class="price">600 ₸</div>
<div class="vols"><button onclick="add('Арахис',600)" data-ru="В корзину" data-kz="Себетке">В корзину</button></div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1613919113640-25732ec5e61f?w=600">
<h3 data-ru="Фисташки" data-kz="Пісте">Фисташки</h3>
<div class="price">900 ₸</div>
<div class="vols"><button onclick="add('Фисташки',900)" data-ru="В корзину" data-kz="Себетке">В корзину</button></div>
</div>

</div>
<div class="footer">
<span data-ru="Доставка по городу • Заказ через WhatsApp" data-kz="Қала бойынша жеткізу • WhatsApp арқылы тапсырыс">Доставка по городу • Заказ через WhatsApp</span><br>
<span data-ru="Телефон: +7 701 753 13 37" data-kz="Телефон: +7 701 753 13 37">Телефон: +7 701 753 13 37</span>
</div>
<a class="whatsapp-btn" href="https://wa.me/77017531337" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3670/3670051.png" alt="WhatsApp"></a>
<div class="cart-bar" id="cart">Корзина пуста</div>
<script>
let total=0, count=0, items=[];
let lang='ru';
function setLang(l){
  lang=l;
  document.getElementById('btn-ru').className = l=='ru' ? 'active' : '';
  document.getElementById('btn-kz').className = l=='kz' ? 'active' : '';
  document.querySelectorAll('[data-ru]').forEach(el=>{ el.innerText = el.getAttribute('data-'+l); });
  document.documentElement.lang = l;
  updateCart();
}
function updateCart(){
  if(count==0){ document.getElementById('cart').innerText = lang=='ru' ? 'Корзина пуста' : 'Себет бос'; }
  else { document.getElementById('cart').innerText = lang=='ru' ? 'Корзина: '+count+' тов. — '+total+' ₸ • Оформить в WhatsApp' : 'Себет: '+count+' тауар — '+total+' ₸ • WhatsApp арқылы рәсімдеу'; }
}
function add(name,price){ total+=price; count++; items.push(name); updateCart(); document.getElementById('cart').onclick = function(){ let msg = lang=='ru' ? 'Здравствуйте! Хочу заказать: ' : 'Сәлеметсіз бе! Тапсырыс бергім келеді: '; window.open('https://wa.me/77017531337?text='+msg+items.join(', ')+' Итого: '+total+' тг','_blank'); }; }
</script>
</body>
</html>
