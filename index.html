<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pivas Store - Пиво</title>
<style>
body{font-family:Arial,sans-serif;background:#1a1a2e;color:white;margin:0;padding:0}
.top{display:flex;gap:8px;justify-content:center;padding:12px;flex-wrap:wrap}
.top a{background:#2a2a44;color:white;text-decoration:none;padding:8px 14px;border-radius:20px;font-size:14px}
.top a.active{background:#ff8c00}
h1{text-align:center;color:#ff8c00;margin:5px 0 0;font-size:22px}
p{text-align:center;color:#ccc;font-size:13px;margin:5px 0 15px}
.container{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:10px}
.card{background:#222244;border-radius:10px;padding:12px;text-align:center}
.card h3{font-size:14px;margin:5px 0;min-height:32px}
.price{font-size:18px;font-weight:bold;color:#ff8c00;margin:8px 0}
.btns{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.btns button{background:#333366;color:white;border:1px solid #555;padding:6px 10px;border-radius:15px;font-size:13px;cursor:pointer}
.btns button.selected{background:#ff8c00;color:black;font-weight:bold}
.cart-btn{background:#ff8c00;color:black;border:none;padding:8px 16px;border-radius:20px;font-weight:bold;margin-top:8px;width:100%;font-size:14px;cursor:pointer}
.cart-link{display:block;text-align:center;background:#ff8c00;color:black;font-weight:bold;padding:12px;margin:10px;border-radius:10px;text-decoration:none}
@media(max-width:600px){.container{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="top">
<a href="index.html" class="active">🍺 Пиво</a>
<a href="krepkoe.html">🥃 Крепкое</a>
<a href="sneki.html">🍿 Снэки</a>
<a href="ryba.html">🐟 Рыба</a>
</div>
<h1>🍺 РАЗЛИВНОЕ ПИВО</h1>
<p>Выбери объём и нажми 🛒</p>
<div class="container" id="products"></div>
<a href="cart.html" class="cart-link">🛒 Перейти в корзину</a>

<script>
const beers=[
{name:"Шымкент Прага",price:750},
{name:"СССР",price:650},
{name:"Алма-Ата Жигулёвское",price:650},
{name:"Чешское Элитное",price:700},
{name:"Дербес Прага",price:800},
{name:"Дербес Немецкое",price:800},
{name:"Шымкент Мягкое",price:750},
{name:"MILBORG",price:900},
{name:"STUTTGART",price:1000},
{name:"Бирхан Нефильтрованное",price:1000},
{name:"Квас",price:500},
];
let selected={};
function render(){
document.getElementById('products').innerHTML=beers.map((b,i)=>{
let sel=selected[i]||1;
return `<div class="card"><h3>${b.name}</h3><div class="price">${b.price} ₸ / л</div>
<div class="btns">
<button class="${sel==0.5?'selected':''}" onclick="selectLiters(${i},0.5,this)">0.5 л</button>
<button class="${sel==1?'selected':''}" onclick="selectLiters(${i},1,this)">1 л</button>
<button class="${sel==2?'selected':''}" onclick="selectLiters(${i},2,this)">2 л</button>
<button class="${sel==5?'selected':''}" onclick="selectLiters(${i},5,this)">5 л</button>
</div>
<div style="margin-top:6px;font-size:13px;color:#ccc">Выбрано: ${sel} л = ${sel*b.price} ₸</div>
<button class="cart-btn" onclick="addToCart(${i})">🛒 В корзину</button>
</div>`}).join('');
}
function selectLiters(i,liters,btn){selected[i]=liters;render();}
function addToCart(i){
let b=beers[i]; let liters=selected[i]||1;
let cart=JSON.parse(localStorage.getItem('cart')||'[]');
let found=cart.find(x=>x.name==b.name && x.liters==liters);
if(found){found.qty+=1;} else {cart.push({name:b.name,price:b.price,liters:liters,qty:1});}
localStorage.setItem('cart',JSON.stringify(cart));
alert(b.name+' '+liters+' л добавлено! Сумма: '+(liters*b.price)+' ₸');
}
render();
</script>
</body>
</html>
