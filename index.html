<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pivas Store</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.banner img{width:100%;display:block}
.langs{text-align:center;padding:10px}
.langs button{background:#111;color:#d4af37;border:1px solid #d4af37;padding:7px 18px;border-radius:20px;margin:0 6px}
h1{text-align:center;color:#d4af37;margin:12px 0 2px}
.sub{text-align:center;color:#aaa;margin-bottom:14px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px 90px}
.card{background:#121212;border:1px solid #d4af37;border-radius:14px;padding:8px;text-align:center}
.card img{width:100%;height:170px;object-fit:cover;border-radius:10px;background:#000}
.card b{color:#d4af37;display:block;margin:4px 0}
button.buy{background:#d4af37;color:#000;border:none;padding:8px 12px;border-radius:8px;font-weight:bold;width:95%;margin-top:4px}
.cart-btn{position:fixed;top:10px;right:10px;background:#d4af37;color:#000;padding:10px 16px;border-radius:22px;text-decoration:none;z-index:999;font-weight:bold}
#cart-count{background:#000;color:#d4af37;border-radius:50%;padding:2px 7px;margin-left:5px}
</style>
</head>
<body>
<a href="cart.html" class="cart-btn">🛒 <span id="t-cart">Себет</span> <span id="cart-count"></span></a>
<div class="banner"><img src="banner.jpg"></div>
<div class="langs" style="position:fixed;top:10px;left:10px;z-index:999;display:flex;gap:6px"><button onclick="setLang('kz')" style="background:#d4af37;color:#000;padding:6px 12px;border-radius:20px;font-weight:bold">🇰🇿 KZ</button><button onclick="setLang('ru')" style="background:#000;border:1px solid #d4af37;color:#fff;padding:6px 12px;border-radius:20px">🇷🇺 RU</button></div>
<h1>Pivas Store 🍺</h1>
<div class="sub" id="t-sub">Сенің стилің - сенің күшің</div>
<div class="products">
<div class="card"><img src="1-gus.jpg" loading="lazy"><div>Žatecký Gus</div><b>500 тг</b><button class="buy" onclick="addToCart('Gus',500)">Себетке</button></div>
<div class="card"><img src="10-chesh.jpg" loading="lazy"><div>Чешское</div><b>600 тг</b><button class="buy" onclick="addToCart('Чешское',600)">Себетке</button></div>
<div class="card"><img src="2-shym-praga.jpg" loading="lazy"><div>Шым Прага</div><b>600 тг</b><<div class="langs" style="position:fixed;top:10px;left:10px;z-index:999;display:flex;gap:6px"><button onclick="setLang('kz')" style="background:#d4afbutton class="buy" onclick="addToCart('Шым Прага',600)">Себетке</button></div>
<div class="card"><img src="11-shym-myag.jpg" loading="lazy"><div>Шым Мягкое</div><b>600 тг</b><button class="buy" onclick="addToCart('Шым Мягкое',600)">Себетке</button></div>
<div class="card"><img src="3-sssr.jpg" loading="lazy"><div>СССР</div><b>550 тг</b><button class="buy" onclick="addToCart('СССР',550)">Себетке</button></div>
<div class="card"><img src="4-alma-ata.jpg" loading="lazy"><div>Алма-Ата</div><b>550 тг</b><button class="buy" onclick="addToCart('Алма-Ата',550)">Себетке</button></div>
<div class="card"><img src="5-birhan.jpg" loading="lazy"><div>Birhan</div><b>600 тг</b><button class="buy" onclick="addToCart('Birhan',600)">Себетке</button></div>
<div class="card"><img src="6-milborg.jpg" loading="lazy"><div>Milborg</div><b>650 тг</b><button class="buy" onclick="addToCart('Milborg',650)">Себетке</button></div>
</div>
<script>
let cart=JSON.parse(localStorage.getItem('cart')||'[]');
function updateBadge(){let b=document.getElementById('cart-count');if(b)b.textContent=cart.length?cart.length:''}
function addToCart(n,p){cart.push({name:n,price:p});localStorage.setItem('cart',JSON.stringify(cart));updateBadge();alert(n+' ✓')}
function setLang(l){localStorage.setItem('lang',l);let kz=l==='kz';document.getElementById('t-cart').textContent=kz?'Себет':'Корзина';document.getElementById('t-sub').textContent=kz?'Сенің стилің - сенің күшің':'Твой стиль - твоя сила';document.querySelectorAll('.buy').forEach(b=>b.textContent=kz?'Себетке':'В корзину')}
updateBadge();setLang(localStorage.getItem('lang')||'kz');
</script>
</body>
</html>
