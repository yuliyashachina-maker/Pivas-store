<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pivas Store</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:Arial;padding:15px;margin:0}
h1{text-align:center;margin-top:50px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#1a1a1a;padding:10px;border-radius:12px;text-align:center}
.card img{width:100%;height:180px;object-fit:cover;border-radius:8px}
button{background:#e63946;color:#fff;border:none;padding:8px 14px;border-radius:8px;margin-top:8px;cursor:pointer;font-weight:bold}
.cart-btn{position:fixed;top:12px;right:12px;background:#e63946;color:#fff;padding:10px 16px;border-radius:20px;text-decoration:none;z-index:999;font-weight:bold}
#cart-count{background:#fff;color:#e63946;border-radius:50%;padding:2px 7px;margin-left:6px}
</style>
</head>
<body>
<a href="cart.html" class="cart-btn">🛒 Корзина <span id="cart-count"></span></a>
<h1>Pivas Store 🍺</h1>
<div class="products">
<div class="card"><img src="1-gus.jpg"><div>Гусь 1</div><b>500 тг</b><br><button onclick="addToCart('Гусь 1',500)">В корзину</button></div>
<div class="card"><img src="2-chesh.jpg"><div>Чешское</div><b>600 тг</b><br><button onclick="addToCart('Чешское',600)">В корзину</button></div>
<div class="card"><img src="3-arbuz.jpg"><div>Арбуз</div><b>600 тг</b><br><button onclick="addToCart('Арбуз',600)">В корзину</button></div>
<div class="card"><img src="4-mohito.jpg"><div>Мохито</div><b>600 тг</b><br><button onclick="addToCart('Мохито',600)">В корзину</button></div>
</div>
<script src="cart.js"></script>
</body>
</html>
