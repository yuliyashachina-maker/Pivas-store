<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pivas Store</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:0}
.banner img{width:100%;display:block;border-bottom:3px solid #d4af37}
h1{text-align:center;color:#d4af37;margin:18px 0 4px}
.sub{text-align:center;color:#aaa;margin-bottom:18px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 10px 90px}
.card{background:#121212;border:1px solid #d4af37;border-radius:14px;padding:10px;text-align:center}
.card img{width:100%;height:170px;object-fit:cover;border-radius:10px}
.card b{color:#d4af37;display:block;margin:5px 0}
button{background:#d4af37;color:#000;border:none;padding:8px 15px;border-radius:8px;font-weight:bold}
.cart-btn{position:fixed;top:10px;right:10px;background:#d4af37;color:#000;padding:10px 16px;border-radius:22px;text-decoration:none;z-index:999;font-weight:bold}
#cart-count{background:#000;color:#d4af37;border-radius:50%;padding:2px 7px;margin-left:6px;border:1px solid #d4af37}
</style>
</head>
<body>
<a href="cart.html" class="cart-btn">🛒 Корзина <span id="cart-count"></span></a>
<div class="banner"><img src="banner.jpg"></div>
<h1>Pivas Store 🍺</h1>
<div class="sub">Твой стиль - твоя сила</div>
<div class="products">
<div class="card"><img src="1-gus.jpg"><div>Гусь 1</div><b>500 тг</b><br><button onclick="addToCart('Гусь 1',500)">В корзину</button></div>
<div class="card"><img src="2-chesh.jpg"><div>Чешское</div><b>600 тг</b><br><button onclick="addToCart('Чешское',600)">В корзину</button></div>
<div class="card"><img src="3-arbuz.jpg"><div>Арбуз</div><b>600 тг</b><br><button onclick="addToCart('Арбуз',600)">В корзину</button></div>
<div class="card"><img src="4-mohito.jpg"><div>Мохито</div><b>600 тг</b><br><button onclick="addToCart('Мохито',600)">В корзину</button></div>
</div>
<script src="cart.js"></script>
</body>
</html>
