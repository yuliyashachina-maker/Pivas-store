<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Корзина</title><style>body{background:#111;color:#fff;font-family:Arial;padding:15px}a{color:#e63946}.item{background:#222;padding:12px;margin:8px 0;border-radius:10px;display:flex;justify-content:space-between}button{background:#e63946;color:#fff;border:0;padding:10px 16px;border-radius:8px}</style></head><body><a href="index.html">← Магазин</a><h1>🛒 Корзина</h1><div id="list"></div><h2 id="total"></h2><button onclick="localStorage.removeItem('cart');location.reload()">Очистить</button> <button onclick="order()">Заказать в WhatsApp</button><script>let c=JSON.parse(localStorage.getItem('cart')||'[]');let s=0,h='';c.forEach((x,i)=>{s+=x.price;h+=`<div class=item><span>${x.name} - ${x.price}тг</span><button onclick="c.splice(${i},1);localStorage.setItem('cart',JSON.stringify(c));location.reload()">X</button></div>`});document.getElementById('list').innerHTML=h||'Корзина пуста';document.getElementById('total').innerHTML='Итого: '+s+' тг';function order(){let m='Заказ:%0A';c.forEach(p=>m+=p.name+'-'+p.price+'%0A');m+='Итого:'+s;open('https://wa.me/77004451423?text='+m)}</script></body></html>
