<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Корзина</title>
<style>
body{background:#0d0d1a;color:#fff;font-family:Arial;margin:0;padding:12px}
a{color:#ff8c00}
h1{text-align:center;color:#ff8c00}
.item{background:#1e1e3a;padding:12px;border-radius:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item b{font-size:15px}
.item span{color:#ff8c00;font-weight:bold}
.del{background:#ff4444;color:#fff;border:none;padding:8px 12px;border-radius:10px}
.clear{background:#333;color:#fff;border:none;padding:10px;width:100%;border-radius:10px;margin-top:10px}
.wa{display:block;text-align:center;background:#25D366;color:#fff;font-weight:bold;padding:14px;border-radius:12px;text-decoration:none;margin-top:12px;font-size:17px}
.total{text-align:center;font-size:19px;font-weight:bold;margin-top:14px}
.total span{color:#ff8c00}
</style>
</head>
<body>
<a href="index.html">← Назад к пиву</a>
<h1>🛒 Корзина</h1>
<div id="list"></div>
<div class="total" id="total"></div>
<a id="waBtn" class="wa" href="#" target="_blank">Заказать в WhatsApp</a>
<button class="clear" onclick="clearCart()">Очистить корзину</button>
<script>
function getCart(){
  let c = JSON.parse(localStorage.getItem('cart')||'[]');
  if(c.length) return c;
  // если другие страницы сохраняли под другим именем
  let c2 = JSON.parse(localStorage.getItem('cartItems')||'[]');
  if(c2.length) return c2;
  let c3 = JSON.parse(localStorage.getItem('basket')||'[]');
  return c3;
}
function saveCart(c){localStorage.setItem('cart',JSON.stringify(c));}
function render(){
  let cart=getCart();
  let list=document.getElementById('list');
  if(!cart.length){
    list.innerHTML='<p style="text-align:center">Корзина пустая</p>';
    document.getElementById('total').textContent='';
    return;
  }
  let total=0;
  list.innerHTML=cart.map((it,i)=>{
    let qty=it.qty||1;
    let price=it.price||0;
    total+=qty*price;
    let name=it.name||'Товар';
    return '<div class="item"><div><b>'+name+'</b><br>'+qty+' шт × '+price+' ₸</div><div><span>'+(qty*price)+' ₸</span><br><button class="del" onclick="delItem('+i+')">✕</button></div></div>';
  }).join('');
  document.getElementById('total').innerHTML='Итого: <span>'+total+' ₸</span>';
  let text='Здравствуйте! Хочу заказать:%0A';
  cart.forEach(it=>{text+= '- '+(it.name||'Товар')+' - '+(it.qty||1)+' шт - '+(it.qty||1)*(it.price||0)+' ₸%0A';});
  text+='Итого: '+total+' ₸';
  // ПОМЕНЯЙ НОМЕР ТУТ: 77017531337 -> твой номер
  document.getElementById('waBtn').href='https://wa.me/77017531337?text='+text;
}
function delItem(i){
  let cart=getCart(); cart.splice(i,1); saveCart(cart); render();
}
function clearCart(){localStorage.removeItem('cart');localStorage.removeItem('cartItems');localStorage.removeItem('basket');render();}
render();
</script>
</body>
</html>
