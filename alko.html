<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>КРЕПКИЙ АЛКОГОЛЬ</title>
<style>body{font-family:Arial;background:#fff8e1;padding:15px}h1{text-align:center} .card{background:#fff;border:1px solid #eee;border-radius:12px;padding:12px;margin:10px 0} input{width:100%;padding:10px;font-size:16px;margin:5px 0;border-radius:8px;border:1px solid #ccc} .res{font-weight:bold;color:green;font-size:18px}</style></head>
<body><h1>🥃 КРЕПКИЙ АЛКОГОЛЬ +30%</h1>
<div class="card"><b>Водка Белая Березка 0.5</b><input type="number" placeholder="Введи закупку" oninput="this.nextElementSibling.innerText='Продажа: '+Math.round(this.value*1.3)+' тг'"><div class="res"></div></div>
<div class="card"><b>Водка Хаома 0.5</b><input type="number" placeholder="Введи закупку" oninput="this.nextElementSibling.innerText='Продажа: '+Math.round(this.value*1.3)+' тг'"><div class="res"></div></div>
<div class="card"><b>Коньяк Казахстан 0.5</b><input type="number" placeholder="Введи закупку" oninput="this.nextElementSibling.innerText='Продажа: '+Math.round(this.value*1.3)+' тг'"><div class="res"></div></div>
<div style="text-align:center;margin-top:20px"><a href="index.html">⬅ На главную</a></div>
</body></html>
